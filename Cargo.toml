[package]
name = "gift"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
env_logger = "0.11.10"
flate2 = "1.1.9"
hex = "0.4.3"
hex-literal = "1.1.0"
log = "0.4.29"
sha1 = "0.11.0"
clap = { version = "4.6.1", features = ["derive"] }
io = "0.0.2"
ureq = { version = "3.3.0", features = ["json"] }
diffy = "0.5.0"
# giftai（AI 对话上下文管理器）所需：同步 HTTP 客户端 + JSON 序列化
# ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
